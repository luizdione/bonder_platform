# =============================================================================
# bonder - mapa de AMOSTRAS. Reconciliar nomes de coluna da matriz (derivados
# dos basenames dos .raw) com a estrutura experimental. E consumido para montar
# MSDataset.samples e para definir os contrastes isca-vs-controle no scoring.
#
# condition : rotulo curto do grupo (ex.: IP_NSs, CTRL_IgG)
# bait_id   : id em baits.yaml, ou 'control' para os controles
# role      : 'bait' (co-IP da isca) ou 'control' (IgG/mock/parental)
# replicate : inteiro >= 1
# raw_file  : nome do arquivo bruto/coluna correspondente na matriz
#
# Recomendacao de desenho (publicabilidade): >= 3 replicas biologicas por grupo
# e um controle negativo pareado (IgG/mock/linhagem parental) por isca.
#
# METODOLOGIA (ver baits.yaml -> design, e docs/METODOLOGIA.md):
#   NSs   -> PROTEOMA SUBTRATIVO. IP_NSs = macrofagos murinos superexpressando
#            NSs; CTRL_NSs = macrofagos murinos WILD-TYPE (WT), o threshold
#            negativo. Candidato = enriquecido no NSs e ausente/reduzido no WT.
#   LGALS3 -> co-IP classica (isca vs controle pareado), tambem em host murino.
# =============================================================================
schema_version: 1

# Descricao do desenho (documental; o loader le apenas 'samples' e 'contrasts').
design:
  NSs_ICOARACI:
    strategy: subtractive
    test_condition: IP_NSs            # macrofagos superexpressando NSs
    control_condition: CTRL_NSs       # macrofagos wild-type (WT) = threshold negativo
  LGALS3_HUMAN:
    strategy: ap_ms_specificity
    test_condition: IP_LGALS3
    control_condition: CTRL_LGALS3    # controle pareado murino

samples:
  # ---- Isca 1: NSs (Icoaraci) - PROTEOMA SUBTRATIVO ----
  # IP_NSs  = macrofagos murinos superexpressando NSs (teste)
  # CTRL_NSs = macrofagos murinos wild-type (WT) = threshold negativo
  - sample: NSs_IP_1
    condition: IP_NSs
    bait_id: NSs_ICOARACI
    role: bait
    replicate: 1
    raw_file: NSs_IP_1.raw
  - sample: NSs_IP_2
    condition: IP_NSs
    bait_id: NSs_ICOARACI
    role: bait
    replicate: 2
    raw_file: NSs_IP_2.raw
  - sample: NSs_IP_3
    condition: IP_NSs
    bait_id: NSs_ICOARACI
    role: bait
    replicate: 3
    raw_file: NSs_IP_3.raw
  - sample: NSs_CTRL_1
    condition: CTRL_NSs
    bait_id: control
    role: control
    replicate: 1
    raw_file: NSs_CTRL_1.raw
  - sample: NSs_CTRL_2
    condition: CTRL_NSs
    bait_id: control
    role: control
    replicate: 2
    raw_file: NSs_CTRL_2.raw
  - sample: NSs_CTRL_3
    condition: CTRL_NSs
    bait_id: control
    role: control
    replicate: 3
    raw_file: NSs_CTRL_3.raw

  # ---- Isca 2: Galectina-3 (LGALS3 humana) ----
  - sample: LGALS3_IP_1
    condition: IP_LGALS3
    bait_id: LGALS3_HUMAN
    role: bait
    replicate: 1
    raw_file: LGALS3_IP_1.raw
  - sample: LGALS3_IP_2
    condition: IP_LGALS3
    bait_id: LGALS3_HUMAN
    role: bait
    replicate: 2
    raw_file: LGALS3_IP_2.raw
  - sample: LGALS3_IP_3
    condition: IP_LGALS3
    bait_id: LGALS3_HUMAN
    role: bait
    replicate: 3
    raw_file: LGALS3_IP_3.raw
  - sample: LGALS3_CTRL_1
    condition: CTRL_LGALS3
    bait_id: control
    role: control
    replicate: 1
    raw_file: LGALS3_CTRL_1.raw
  - sample: LGALS3_CTRL_2
    condition: CTRL_LGALS3
    bait_id: control
    role: control
    replicate: 2
    raw_file: LGALS3_CTRL_2.raw
  - sample: LGALS3_CTRL_3
    condition: CTRL_LGALS3
    bait_id: control
    role: control
    replicate: 3
    raw_file: LGALS3_CTRL_3.raw

# Contrastes isca-vs-controle avaliados pelo scoring (SAINT/MSstats).
contrasts:
  - name: NSs_vs_CTRL
    bait_id: NSs_ICOARACI
    test: IP_NSs                       # macrofagos superexpressando NSs
    control: CTRL_NSs                  # macrofagos WT (threshold negativo subtrativo)
    strategy: subtractive
  - name: LGALS3_vs_CTRL
    bait_id: LGALS3_HUMAN
    test: IP_LGALS3
    control: CTRL_LGALS3               # controle pareado murino
    strategy: ap_ms_specificity
